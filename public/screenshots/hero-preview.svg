<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad)" rx="16" />
  
  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="220" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="250" fill="#6366f1" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="300" r="180" fill="#0d9488" opacity="0.15" filter="url(#glow)" />

  <!-- Window Frame Header -->
  <rect x="0" y="0" width="1200" height="50" fill="#0f172a" opacity="0.8" rx="16" />
  <circle cx="30" cy="25" r="7" fill="#ef4444" />
  <circle cx="50" cy="25" r="7" fill="#f59e0b" />
  <circle cx="70" cy="25" r="7" fill="#10b981" />
  <text x="600" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">yenuli-munasinghe.github.io</text>

  <!-- Navbar -->
  <rect x="60" y="80" width="1080" height="60" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.1" rx="12" />
  <text x="100" y="117" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="bold" font-size="20">Yenuli.M</text>
  
  <text x="750" y="115" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15">About</text>
  <text x="830" y="115" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15">Skills</text>
  <text x="910" y="115" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15">Projects</text>
  <text x="990" y="115" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15">Contact</text>

  <!-- Hero Content Grid -->
  <!-- Left Column Text -->
  <rect x="100" y="210" width="260" height="32" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.4" rx="16" />
  <text x="120" y="231" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">👋 Available for Internships</text>

  <text x="100" y="300" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="44">Hi, I'm Yenuli Munasinghe</text>
  
  <text x="100" y="345" fill="url(#accent-cyan)" font-family="-apple-system, sans-serif" font-weight="700" font-size="24">IT &amp; Management Undergraduate</text>
  
  <text x="100" y="395" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16" width="550">
    <tspan x="100" dy="0">Specializing in Software Engineering, Data Science, &amp; Business Strategy.</tspan>
    <tspan x="100" dy="24">Building scalable full-stack &amp; mobile solutions with clean architecture.</tspan>
  </text>

  <!-- Action Buttons -->
  <rect x="100" y="460" width="170" height="50" fill="url(#accent-cyan)" rx="10" />
  <text x="185" y="491" fill="#0f172a" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" text-anchor="middle">View Projects →</text>

  <rect x="290" y="460" width="160" height="50" fill="url(#card-glass)" stroke="#38bdf8" stroke-opacity="0.5" rx="10" />
  <text x="370" y="491" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="600" font-size="15" text-anchor="middle">Get In Touch</text>

  <!-- Right Column Profile Avatar Mockup -->
  <circle cx="920" cy="370" r="150" fill="#0284c7" opacity="0.2" filter="url(#glow)" />
  <circle cx="920" cy="370" r="130" fill="url(#card-glass)" stroke="url(#accent-cyan)" stroke-width="3" />
  <circle cx="920" cy="330" r="45" fill="#38bdf8" opacity="0.7" />
  <path d="M 830 460 C 830 390, 1010 390, 1010 460 Z" fill="#38bdf8" opacity="0.7" />

  <!-- Floating Tech Badges -->
  <rect x="710" y="240" width="110" height="36" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
  <text x="765" y="263" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">React 19</text>

  <rect x="1000" y="270" width="100" height="36" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.3" rx="8" />
  <text x="1050" y="293" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Vite 7</text>

  <rect x="730" y="480" width="120" height="36" fill="#0f172a" stroke="#34d399" stroke-opacity="0.3" rx="8" />
  <text x="790" y="503" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tailwind CSS</text>
</svg>
