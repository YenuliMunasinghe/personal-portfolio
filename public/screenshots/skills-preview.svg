<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)" rx="16" />
  <circle cx="200" cy="200" r="180" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="200" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <text x="600" y="70" fill="url(#accent-cyan)" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="2">TECHNICAL EXPERTISE</text>
  <text x="600" y="115" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="34" text-anchor="middle">Skills &amp; Competencies</text>

  <!-- Skills Categories Grid (4 Cards) -->
  <g transform="translate(80, 160)">
    <!-- Category 1: Languages -->
    <rect x="0" y="0" width="500" height="210" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.1" rx="14" />
    <text x="25" y="40" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">⚡ Programming Languages</text>
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="130" height="34" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
      <text x="65" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">JavaScript (ES6+)</text>

      <rect x="145" y="0" width="85" height="34" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
      <text x="187" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Python</text>

      <rect x="245" y="0" width="75" height="34" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
      <text x="282" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Java</text>

      <rect x="335" y="0" width="70" height="34" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
      <text x="370" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">PHP</text>

      <rect x="0" y="48" width="60" height="34" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
      <text x="30" y="70" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">SQL</text>

      <rect x="75" y="48" width="80" height="34" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
      <text x="115" y="70" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">HTML5</text>

      <rect x="170" y="48" width="70" height="34" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" rx="8" />
      <text x="205" y="70" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">CSS3</text>
    </g>

    <!-- Category 2: Frontend & Mobile -->
    <rect x="540" y="0" width="500" height="210" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.1" rx="14" />
    <text x="565" y="40" fill="#818cf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">📱 Frontend &amp; Mobile</text>
    <g transform="translate(565, 65)">
      <rect x="0" y="0" width="115" height="34" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.3" rx="8" />
      <text x="57" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">React Native</text>

      <rect x="130" y="0" width="70" height="34" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.3" rx="8" />
      <text x="165" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Expo</text>

      <rect x="215" y="0" width="85" height="34" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.3" rx="8" />
      <text x="257" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">React.js</text>

      <rect x="315" y="0" width="125" height="34" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.3" rx="8" />
      <text x="377" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Vanilla JS</text>
    </g>
  </g>

  <g transform="translate(80, 400)">
    <!-- Category 3: Backend & APIs -->
    <rect x="0" y="0" width="500" height="210" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.1" rx="14" />
    <text x="25" y="40" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">⚙️ Backend &amp; APIs</text>
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="85" height="34" fill="#0f172a" stroke="#34d399" stroke-opacity="0.3" rx="8" />
      <text x="42" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Node.js</text>

      <rect x="100" y="0" width="100" height="34" fill="#0f172a" stroke="#34d399" stroke-opacity="0.3" rx="8" />
      <text x="150" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Express.js</text>

      <rect x="215" y="0" width="90" height="34" fill="#0f172a" stroke="#34d399" stroke-opacity="0.3" rx="8" />
      <text x="260" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">REST APIs</text>

      <rect x="315" y="0" width="110" height="34" fill="#0f172a" stroke="#34d399" stroke-opacity="0.3" rx="8" />
      <text x="370" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">WebSockets</text>
    </g>

    <!-- Category 4: Databases & Cloud -->
    <rect x="540" y="0" width="500" height="210" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.1" rx="14" />
    <text x="565" y="40" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">☁️ Databases &amp; Cloud</text>
    <g transform="translate(565, 65)">
      <rect x="0" y="0" width="90" height="34" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.3" rx="8" />
      <text x="45" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">MongoDB</text>

      <rect x="105" y="0" width="80" height="34" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.3" rx="8" />
      <text x="145" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">MySQL</text>

      <rect x="200" y="0" width="90" height="34" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.3" rx="8" />
      <text x="245" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Firebase</text>

      <rect x="305" y="0" width="105" height="34" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.3" rx="8" />
      <text x="357" y="22" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">ThingSpeak</text>
    </g>
  </g>
</svg>
