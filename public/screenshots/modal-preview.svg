<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="modal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Blurred Backdrop -->
  <rect width="1200" height="675" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="675" fill="#000000" opacity="0.6" />
  <circle cx="600" cy="337" r="300" fill="#0284c7" opacity="0.2" filter="url(#glow)" />

  <!-- Modal Container -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="800" height="575" fill="url(#modal-bg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" rx="20" />
    
    <!-- Modal Header Image -->
    <rect x="0" y="0" width="800" height="180" fill="#0284c7" fill-opacity="0.3" rx="20" />
    <text x="400" y="100" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">🐾 StrayCare Architecture</text>
    
    <!-- Close Button -->
    <circle cx="760" cy="35" r="16" fill="#334155" />
    <text x="760" y="41" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✕</text>

    <!-- Modal Content -->
    <g transform="translate(40, 210)">
      <text x="0" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">FULL STACK &amp; MOBILE PLATFORM</text>
      <text x="0" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">StrayCare — Stray Animal Reporting &amp; Live Tracking</text>
      
      <text x="0" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">
        <tspan x="0" dy="0">A monorepo platform comprising an Expo/React Native mobile app, React web admin dashboard,</tspan>
        <tspan x="0" dy="22">and Node.js REST API designed to streamline reporting and rescue workflows.</tspan>
      </text>

      <!-- Key Technical Contributions Heading -->
      <text x="0" y="145" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Key Engineering Contributions</text>

      <!-- Contribution Bullet 1 -->
      <circle cx="8" cy="175" r="4" fill="#38bdf8" />
      <text x="22" y="180" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14"><tspan font-weight="bold" fill="#38bdf8">Geospatial Query Optimization:</tspan> Optimized map query speed via 2DSphere indexing.</text>

      <!-- Contribution Bullet 2 -->
      <circle cx="8" cy="205" r="4" fill="#38bdf8" />
      <text x="22" y="210" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14"><tspan font-weight="bold" fill="#38bdf8">Atomic State Machine:</tspan> Built sequential rescue status machine with concurrency lock.</text>

      <!-- Contribution Bullet 3 -->
      <circle cx="8" cy="235" r="4" fill="#38bdf8" />
      <text x="22" y="240" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="bold" fill="#38bdf8">Real-time WebSockets &amp; Push Alerts:</tspan>
      <text x="22" y="258" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14">Integrated Socket.IO for dispatch updates and Expo Push API for mobile alerts.</text>

      <!-- Tech Stack Badges -->
      <g transform="translate(0, 280)">
        <rect x="0" y="0" width="90" height="26" fill="#0369a1" fill-opacity="0.4" rx="6" />
        <text x="45" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">React Native</text>

        <rect x="100" y="0" width="70" height="26" fill="#0369a1" fill-opacity="0.4" rx="6" />
        <text x="135" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Express.js</text>

        <rect x="180" y="0" width="80" height="26" fill="#0369a1" fill-opacity="0.4" rx="6" />
        <text x="220" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">MongoDB</text>

        <rect x="270" y="0" width="80" height="26" fill="#0369a1" fill-opacity="0.4" rx="6" />
        <text x="310" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Socket.IO</text>
      </g>
    </g>
  </g>
</svg>
