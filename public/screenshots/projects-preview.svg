<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)" rx="16" />
  <circle cx="950" cy="150" r="200" fill="#0284c7" opacity="0.2" filter="url(#glow)" />
  <circle cx="250" cy="500" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Section Header -->
  <text x="600" y="70" fill="url(#accent-cyan)" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="2">PORTFOLIO SHOWCASE</text>
  <text x="600" y="115" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="34" text-anchor="middle">Featured Engineering Projects</text>

  <!-- Filter Tabs -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="80" height="36" fill="url(#accent-cyan)" rx="18" />
    <text x="40" y="23" fill="#0f172a" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">All</text>

    <rect x="95" y="0" width="110" height="36" fill="#1e293b" stroke="#334155" rx="18" />
    <text x="150" y="23" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Full Stack</text>

    <rect x="220" y="0" width="100" height="36" fill="#1e293b" stroke="#334155" rx="18" />
    <text x="270" y="23" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Mobile</text>

    <rect x="335" y="0" width="130" height="36" fill="#1e293b" stroke="#334155" rx="18" />
    <text x="400" y="23" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">IoT &amp; Security</text>
  </g>

  <!-- Project Cards Grid (3 Cards) -->
  <!-- Card 1: StrayCare -->
  <g transform="translate(80, 210)">
    <rect x="0" y="0" width="320" height="420" fill="url(#card-glass)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" rx="16" />
    <rect x="0" y="0" width="320" height="150" fill="#0284c7" fill-opacity="0.3" rx="16" />
    <text x="160" y="85" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🐾 StrayCare</text>

    <text x="20" y="185" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">FULL STACK &amp; MOBILE</text>
    <text x="20" y="215" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">StrayCare Platform</text>

    <text x="20" y="250" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">
      <tspan x="20" dy="0">Expo mobile app &amp; React admin</tspan>
      <tspan x="20" dy="20">dashboard for stray animal live</tspan>
      <tspan x="20" dy="20">tracking &amp; rescue dispatch.</tspan>
    </text>

    <!-- Tech Tags -->
    <rect x="20" y="320" width="80" height="24" fill="#0369a1" fill-opacity="0.4" rx="6" />
    <text x="60" y="336" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">React Native</text>

    <rect x="110" y="320" width="60" height="24" fill="#0369a1" fill-opacity="0.4" rx="6" />
    <text x="140" y="336" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Node.js</text>

    <rect x="180" y="320" width="70" height="24" fill="#0369a1" fill-opacity="0.4" rx="6" />
    <text x="215" y="336" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">MongoDB</text>

    <!-- Details Button -->
    <rect x="20" y="365" width="280" height="38" fill="url(#accent-cyan)" rx="8" />
    <text x="160" y="389" fill="#0f172a" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">View Deep-Dive Details →</text>
  </g>

  <!-- Card 2: MyBlog -->
  <g transform="translate(440, 210)">
    <rect x="0" y="0" width="320" height="420" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.1" rx="16" />
    <rect x="0" y="0" width="320" height="150" fill="#4f46e5" fill-opacity="0.3" rx="16" />
    <text x="160" y="85" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🔐 MyBlog</text>

    <text x="20" y="185" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">FULL STACK WEB</text>
    <text x="20" y="215" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Security PHP Engine</text>

    <text x="20" y="250" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">
      <tspan x="20" dy="0">Security-hardened blogging engine</tspan>
      <tspan x="20" dy="20">with CSRF defense, HMAC cookies,</tspan>
      <tspan x="20" dy="20">and AJAX post interactions.</tspan>
    </text>

    <!-- Tech Tags -->
    <rect x="20" y="320" width="50" height="24" fill="#4338ca" fill-opacity="0.4" rx="6" />
    <text x="45" y="336" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">PHP</text>

    <rect x="80" y="320" width="60" height="24" fill="#4338ca" fill-opacity="0.4" rx="6" />
    <text x="110" y="336" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">MySQL</text>

    <rect x="150" y="320" width="90" height="24" fill="#4338ca" fill-opacity="0.4" rx="6" />
    <text x="195" y="336" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">CSRF Token</text>

    <rect x="20" y="365" width="280" height="38" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.5" rx="8" />
    <text x="160" y="389" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">View Deep-Dive Details →</text>
  </g>

  <!-- Card 3: Server Room Monitor -->
  <g transform="translate(800, 210)">
    <rect x="0" y="0" width="320" height="420" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.1" rx="16" />
    <rect x="0" y="0" width="320" height="150" fill="#0d9488" fill-opacity="0.3" rx="16" />
    <text x="160" y="85" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">📡 IoT Monitor</text>

    <text x="20" y="185" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">IOT &amp; FULL STACK</text>
    <text x="20" y="215" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Smart Server Monitor</text>

    <text x="20" y="250" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">
      <tspan x="20" dy="0">ESP32 telemetry firmware,</tspan>
      <tspan x="20" dy="20">ThingSpeak metrics streaming,</tspan>
      <tspan x="20" dy="20">and GSM SMS fail-safe alerts.</tspan>
    </text>

    <!-- Tech Tags -->
    <rect x="20" y="320" width="60" height="24" fill="#0f766e" fill-opacity="0.4" rx="6" />
    <text x="50" y="336" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">ESP32</text>

    <rect x="90" y="320" width="70" height="24" fill="#0f766e" fill-opacity="0.4" rx="6" />
    <text x="125" y="336" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Firebase</text>

    <rect x="170" y="320" width="70" height="24" fill="#0f766e" fill-opacity="0.4" rx="6" />
    <text x="205" y="336" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">GSM SMS</text>

    <rect x="20" y="365" width="280" height="38" fill="#1e293b" stroke="#2dd4bf" stroke-opacity="0.5" rx="8" />
    <text x="160" y="389" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">View Deep-Dive Details →</text>
  </g>
</svg>
